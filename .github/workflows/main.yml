name: Build StarfallSite.dll

# Manual only: Actions tab -> "Build StarfallSite.dll" -> Run workflow.
# Builds ONLY the StarfallSite plugin. It looks for the folder holding CMakeLists.txt + src/Gate.cpp
# anywhere in the repo (normally Facility/plugin), so the upload layout doesn't have to be exact.
# GitHub only picks up workflows from <repo root>/.github/workflows/.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Find the plugin folder
        run: |
          $hit = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter Gate.cpp -File |
                 Where-Object { (Split-Path $_.DirectoryName -Leaf) -eq 'src' -and
                                (Test-Path (Join-Path (Split-Path $_.DirectoryName) 'CMakeLists.txt')) } |
                 Select-Object -First 1
          if (-not $hit) {
            Write-Host "Could not find the StarfallSite plugin (CMakeLists.txt + src/Gate.cpp). Everything in the repo:"
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Name | Where-Object { $_ -notlike '.git\*' } | Select-Object -First 300
            exit 1
          }
          $proj = Split-Path $hit.DirectoryName
          Write-Host "Project folder: $proj"
          "PROJ=$proj" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Reuse compiled libraries (spdlog, DirectXTK, ...) from earlier runs
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-starfall-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: vcpkg-starfall-${{ runner.os }}-

      - name: Configure
        working-directory: ${{ env.PROJ }}
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: cmake --build build --config Release --parallel

      - name: Package
        working-directory: ${{ env.PROJ }}
        run: |
          $dist = "$env:GITHUB_WORKSPACE/dist"
          New-Item -ItemType Directory -Force -Path "$dist/SKSE/Plugins/StarfallSite" | Out-Null
          Copy-Item "build/Release/StarfallSite.dll" "$dist/SKSE/Plugins/"
          if (Test-Path "build/Release/StarfallSite.pdb") { Copy-Item "build/Release/StarfallSite.pdb" "$dist/SKSE/Plugins/" }
          Copy-Item "StarfallSite.ini" "$dist/SKSE/Plugins/"
          # the real forms.json comes from the ESP generator; ship the sample only for reference
          Copy-Item "forms.sample.json" "$dist/SKSE/Plugins/StarfallSite/"
          Get-ChildItem -Recurse $dist | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: StarfallSite-dll
          path: dist
