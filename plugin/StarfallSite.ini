; StarfallSite.ini  (goes to Data/SKSE/Plugins/StarfallSite.ini)
; Tuning for StarfallSite.dll. Every key is optional; missing keys use the defaults shown.
; Sections are only for readability. 1 = on, 0 = off. Log: Documents/My Games/Skyrim Special Edition/SKSE/StarfallSite.log

[General]
; Log every spawner / chatter / pounce decision to StarfallSite.log
DebugLog = 0

[Spawner]
; Random headcrab/zombie encounters around Skyrim (groups come from forms.json "spawner")
EnableSpawner = 1
; In-game hours before the same cell can get another spawn
CellCooldownHours = 72
; In-game hours between any two spawns anywhere
GlobalCooldownHours = 2
; Percent chance when you arrive in a qualifying dungeon/cave/mine/den/camp interior
InteriorChance = 18
; Percent chance per new wilderness cell you enter
ExteriorChance = 7
; Never more than this many spawned creatures alive at once
MaxAliveSpawns = 10
; No spawns while you are in combat
NoSpawnInCombat = 1
; Spawn anchors must be this far from you (game units; 70 units is about 1 m)
MinSpawnDistance = 1500
MaxSpawnDistance = 4500
; Prefer anchors you are not facing, so creatures don't pop in in front of you
AvoidPlayerView = 1
; Half angle of the "facing" cone, degrees
ViewConeDegrees = 35
; Percent of wilderness spawns that also drop a crashed canister
CanisterChance = 25
; Dead spawned creatures (and canisters) are removed after this many in-game hours
CorpseLifetimeHours = 24
; A cell that rolled and failed is not rolled again for this many in-game hours
RerollCooldownHours = 6
; Real seconds to wait after a cell loads before picking a spot (lets you finish loading in)
EvaluateDelay = 2.0

[Pounce]
; Experimental: headcrabs leap at their target
EnablePounce = 1
; Leap when the target is between these distances (game units)
PounceMinRange = 120
PounceMaxRange = 480
; Real seconds between leaps for one headcrab
PounceCooldown = 3
; Launch speed toward the target and upward (game units per second)
PounceSpeed = 700
PounceUp = 260
; Behaviour graph event sent when leaping (best guess for the skeever graph; empty = none)
PounceAnimEvent = attackStart

[Chatter]
; Directorate staff talk to each other while you are in the site
EnableChatter = 1
; Average real seconds between conversations (randomized +-50%)
ChatterInterval = 45
; Real seconds before the same conversation can play again
ConversationCooldown = 600
; The two speakers must be within this distance of each other (game units)
ChatterPairDistance = 450
; ...and within this distance of you
ChatterPlayerDistance = 2000

[Dialogue]
; 0 = apply dialogue actions (quest stages, items) when the line finishes, 1 = when it starts
ActionOnTopicStart = 0

[Gate]
; The checkpoint gate in Skyrim (the way into Starfall Crater).
; By default it is placed next to the Embershard Mine map marker, offset by GateOffsetX/GateOffsetY units,
; and snapped onto the ground when that area loads.
; To put it exactly where you want: stand there, open the console and type
;   player.getpos x / player.getpos y / player.getpos z / player.getangle z
; then put the numbers below (GateZ 0 = snap to the ground, GateAngle = the direction the gate door faces).
GateX = 0
GateY = 0
GateZ = 0
GateAngle = 0
; offset from the Embershard Mine map marker (used when GateX and GateY are both 0)
GateOffsetX = 900
GateOffsetY = -600
; 1 = the gate stays locked unless you carry the Zero-Point device (Gravity Gun)
RequireDevice = 1
